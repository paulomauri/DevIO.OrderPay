apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-setup-script
  namespace: orderpay
data:
  setup.sh: |
    #!/bin/sh
    set -e

    KEYCLOAK_URL="http://keycloak:8085"
    KEYCLOAK_URL_HEALTH="http://keycloak:9000"
    ADMIN_USER="${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
    ADMIN_PASS="${KC_BOOTSTRAP_ADMIN_PASSWORD:-Mauri@22}"
    REALM="orderpay"

    echo "Waiting for Keycloak..."
    MAX_RETRIES=30
    RETRY=0
    until curl -sf --connect-timeout 10 --max-time 30 \
        "${KEYCLOAK_URL_HEALTH}/health/ready" > /dev/null 2>&1; do
      RETRY=$((RETRY + 1))
      if [ "${RETRY}" -ge "${MAX_RETRIES}" ]; then
        echo "Keycloak not ready after ${MAX_RETRIES} attempts."
        exit 1
      fi
      echo "  attempt ${RETRY}/${MAX_RETRIES} — retrying in 5s..."
      sleep 5
    done
    echo "Keycloak is ready."

    TOKEN_RESPONSE=$(curl -sf --connect-timeout 10 --max-time 30 \
      -d "client_id=admin-cli" \
      -d "username=${ADMIN_USER}" \
      -d "password=${ADMIN_PASS}" \
      -d "grant_type=password" \
      "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token")

    ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')
    if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
      echo "Failed to get admin token."
      exit 1
    fi
    echo "Admin token obtained."

    AUTH="Authorization: Bearer ${ACCESS_TOKEN}"
    CT="Content-Type: application/json"

    REALM_EXISTS=$(curl -s --connect-timeout 10 --max-time 30 \
      -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}" 2>/dev/null \
      | grep -c '"realm"' || true)

    if [ "$REALM_EXISTS" -gt 0 ]; then
      echo "Realm '${REALM}' already exists."
    else
      curl -s --connect-timeout 10 --max-time 30 -X POST \
        -H "$AUTH" -H "$CT" \
        -d "{\"realm\":\"${REALM}\",\"enabled\":true,\"displayName\":\"OrderPay\",\"sslRequired\":\"none\",\"registrationAllowed\":true,\"registrationEmailAsUsername\":true,\"loginWithEmailAllowed\":true,\"duplicateEmailsAllowed\":false,\"resetPasswordAllowed\":true,\"verifyEmail\":false,\"bruteForceProtected\":true,\"defaultRoles\":[\"customer\"]}" \
        "${KEYCLOAK_URL}/admin/realms"
      echo "Realm '${REALM}' created."
    fi

    for ROLE in admin customer; do
      ROLE_EXISTS=$(curl -s -H "$AUTH" \
        "${KEYCLOAK_URL}/admin/realms/${REALM}/roles/${ROLE}" 2>/dev/null || true)
      if echo "$ROLE_EXISTS" | grep -q "\"name\":\"${ROLE}\""; then
        echo "Role '${ROLE}' already exists."
      else
        curl -sf -X POST -H "$AUTH" -H "$CT" \
          -d "{\"name\":\"${ROLE}\",\"description\":\"${ROLE} role\"}" \
          "${KEYCLOAK_URL}/admin/realms/${REALM}/roles"
        echo "Role '${ROLE}' created."
      fi
    done

    CLIENT_EXISTS=$(curl -s --connect-timeout 10 --max-time 30 \
      -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}/clients?clientId=orderpay-webapi")
    if echo "$CLIENT_EXISTS" | jq -e 'length > 0' > /dev/null; then
      echo "Client 'orderpay-webapi' already exists."
    else
      RESULT=$(curl -s --connect-timeout 10 --max-time 30 \
        -o /tmp/client-response.txt -w "%{http_code}" -X POST \
        -H "$AUTH" -H "$CT" \
        -d '{"clientId":"orderpay-webapi","name":"OrderPay WebApi","enabled":true,"publicClient":false,"bearerOnly":true,"standardFlowEnabled":false,"protocol":"openid-connect"}' \
        "${KEYCLOAK_URL}/admin/realms/${REALM}/clients")
      if [ "$RESULT" = "201" ]; then
        echo "Client 'orderpay-webapi' created."
      else
        echo "Failed to create client 'orderpay-webapi' — HTTP ${RESULT}"
        cat /tmp/client-response.txt
        exit 1
      fi
    fi

    CLIENT_EXISTS=$(curl -s --connect-timeout 10 --max-time 30 \
      -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}/clients?clientId=orderpay-swagger")
    if echo "$CLIENT_EXISTS" | jq -e 'length > 0' > /dev/null; then
      echo "Client 'orderpay-swagger' already exists."
    else
      RESULT=$(curl -s --connect-timeout 10 --max-time 30 \
        -o /tmp/swagger-response.txt -w "%{http_code}" -X POST \
        -H "$AUTH" -H "$CT" \
        -d '{"clientId":"orderpay-swagger","name":"OrderPay Swagger UI","enabled":true,"publicClient":true,"bearerOnly":false,"standardFlowEnabled":true,"directAccessGrantsEnabled":true,"protocol":"openid-connect","redirectUris":["http://localhost:8080/*","http://localhost:5208/*","http://127.0.0.1/*"],"webOrigins":["http://localhost:8080","http://localhost:5208","http://127.0.0.1"]}' \
        "${KEYCLOAK_URL}/admin/realms/${REALM}/clients")
      if [ "$RESULT" = "201" ]; then
        echo "Client 'orderpay-swagger' created."
      else
        echo "Failed to create client 'orderpay-swagger' — HTTP ${RESULT}"
        cat /tmp/swagger-response.txt
        exit 1
      fi
    fi

    SWAGGER_UUID=$(curl -s --connect-timeout 10 --max-time 30 \
      -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}/clients?clientId=orderpay-swagger" \
      | jq -r '.[0].id')

    MAPPER_EXISTS=$(curl -s --connect-timeout 10 --max-time 30 \
      -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${SWAGGER_UUID}/protocol-mappers/models" \
      | jq '[.[] | select(.name == "orderpay-webapi-audience")] | length')

    if [ "$MAPPER_EXISTS" -gt 0 ]; then
      echo "Audience mapper already exists."
    else
      curl -sf -X POST -H "$AUTH" -H "$CT" \
        -d '{"name":"orderpay-webapi-audience","protocol":"openid-connect","protocolMapper":"oidc-audience-mapper","consentRequired":false,"config":{"included.client.audience":"orderpay-webapi","id.token.claim":"false","access.token.claim":"true"}}' \
        "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${SWAGGER_UUID}/protocol-mappers/models"
      echo "Audience mapper added."
    fi

    WEB_SECRET="${KEYCLOAK_WEB_CLIENT_SECRET:-change-me-keycloak-orderpay-web-client-secret}"
    CLIENT_EXISTS=$(curl -s --connect-timeout 10 --max-time 30 \
      -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}/clients?clientId=orderpay-web")
    if echo "$CLIENT_EXISTS" | jq -e 'length > 0' > /dev/null; then
      echo "Client 'orderpay-web' already exists."
    else
      RESULT=$(curl -s --connect-timeout 10 --max-time 30 \
        -o /tmp/web-response.txt -w "%{http_code}" -X POST \
        -H "$AUTH" -H "$CT" \
        -d "{\"clientId\":\"orderpay-web\",\"name\":\"OrderPay Web Frontend\",\"enabled\":true,\"publicClient\":false,\"bearerOnly\":false,\"standardFlowEnabled\":true,\"directAccessGrantsEnabled\":false,\"protocol\":\"openid-connect\",\"secret\":\"${WEB_SECRET}\",\"redirectUris\":[\"http://127.0.0.1/api/auth/callback/keycloak\",\"http://127.0.0.1/*\"],\"webOrigins\":[\"http://127.0.0.1\"]}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM}/clients")
      if [ "$RESULT" = "201" ]; then
        echo "Client 'orderpay-web' created."
      else
        echo "Failed to create client 'orderpay-web' — HTTP ${RESULT}"
        cat /tmp/web-response.txt
        exit 1
      fi
    fi

    WEB_UUID=$(curl -s --connect-timeout 10 --max-time 30 \
      -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}/clients?clientId=orderpay-web" \
      | jq -r '.[0].id')

    MAPPER_EXISTS=$(curl -s --connect-timeout 10 --max-time 30 \
      -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${WEB_UUID}/protocol-mappers/models" \
      | jq '[.[] | select(.name == "orderpay-webapi-audience")] | length')

    if [ "$MAPPER_EXISTS" -gt 0 ]; then
      echo "Web audience mapper already exists."
    else
      curl -sf -X POST -H "$AUTH" -H "$CT" \
        -d '{"name":"orderpay-webapi-audience","protocol":"openid-connect","protocolMapper":"oidc-audience-mapper","consentRequired":false,"config":{"included.client.audience":"orderpay-webapi","id.token.claim":"false","access.token.claim":"true"}}' \
        "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${WEB_UUID}/protocol-mappers/models"
      echo "Web audience mapper added."
    fi

    create_user() {
      EMAIL=$1; PASSWORD=$2; FIRSTNAME=$3; LASTNAME=$4; ROLES=$5
      RESULT=$(curl -s --connect-timeout 10 --max-time 30 \
        -o /dev/null -w "%{http_code}" -X POST -H "$AUTH" -H "$CT" \
        -d "{\"username\":\"${EMAIL}\",\"email\":\"${EMAIL}\",\"enabled\":true,\"emailVerified\":true,\"firstName\":\"${FIRSTNAME}\",\"lastName\":\"${LASTNAME}\",\"credentials\":[{\"type\":\"password\",\"value\":\"${PASSWORD}\",\"temporary\":false}]}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM}/users")
      if [ "$RESULT" != "201" ]; then
        echo "User '${EMAIL}' already exists."
        return
      fi
      USER_ID=$(curl -s --connect-timeout 10 --max-time 30 \
        -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}/users?username=${EMAIL}" \
        | jq -r '.[0].id')
      ROLE_ARRAY="["
      for ROLE in $(echo "$ROLES" | tr ',' ' '); do
        ROLE_DATA=$(curl -sf --connect-timeout 10 --max-time 30 \
          -H "$AUTH" "${KEYCLOAK_URL}/admin/realms/${REALM}/roles/${ROLE}")
        ROLE_ID=$(echo "$ROLE_DATA" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
        ROLE_ARRAY="${ROLE_ARRAY}{\"id\":\"${ROLE_ID}\",\"name\":\"${ROLE}\"},"
      done
      ROLE_ARRAY="${ROLE_ARRAY%,}]"
      curl -s --connect-timeout 10 --max-time 30 -X POST \
        -H "$AUTH" -H "$CT" -d "${ROLE_ARRAY}" \
        "${KEYCLOAK_URL}/admin/realms/${REALM}/users/${USER_ID}/role-mappings/realm" > /dev/null 2>&1
      echo "User '${EMAIL}' created with roles: ${ROLES}"
    }

    create_user "admin@orderpay.com" "Mauri@22" "Admin" "OrderPay" "admin,customer"
    create_user "user@orderpay.com"  "User@123"  "User"  "OrderPay" "customer"

    echo "Keycloak setup complete."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-setup
  namespace: orderpay
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-setup
          image: alpine:latest
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache curl jq &&
              sh /scripts/setup.sh
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderpay-secrets
                  key: keycloak-admin-password
            - name: KEYCLOAK_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderpay-secrets
                  key: keycloak-client-secret
          volumeMounts:
            - name: setup-script
              mountPath: /scripts
      volumes:
        - name: setup-script
          configMap:
            name: keycloak-setup-script
            defaultMode: 0755
