apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: orderpay
spec:
  selector:
    app: nginx
  # Pinned so the frontend pod's hostAliases (id.localhost -> nginx) is stable.
  # clusterIP is immutable: on an existing cluster, delete the svc before apply.
  clusterIP: 10.96.0.100
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
