apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderpay-web
  namespace: orderpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderpay-web
  template:
    metadata:
      labels:
        app: orderpay-web
    spec:
      # Single shared issuer for browser + server: id.localhost resolves to
      # nginx (-> keycloak) inside the pod, and to 127.0.0.1 (-> nginx -> keycloak)
      # in the browser via *.localhost. Replaces the old socat sidecar.
      hostAliases:
        - ip: "10.96.0.100"          # nginx Service (pinned clusterIP)
          hostnames:
            - "id.localhost"
      containers:
        - name: orderpay-web
          image: paulomauri/orderpay-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXTAUTH_URL
              value: "http://www.localhost"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderpay-secrets
                  key: nextauth-secret
            - name: KEYCLOAK_CLIENT_ID
              value: "orderpay-web"
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderpay-secrets
                  key: keycloak-client-secret
            # Same issuer the browser uses. Server-side discovery/token/jwks hit
            # id.localhost -> (hostAliases) nginx -> keycloak; the token's iss
            # (http://id.localhost/realms/orderpay) then matches on validation.
            - name: KEYCLOAK_ISSUER
              value: "http://id.localhost/realms/orderpay"
            - name: NEXT_PUBLIC_API_URL
              value: ""
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /api/auth/providers
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/auth/providers
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
