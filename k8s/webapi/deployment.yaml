apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderpay-webapi
  namespace: orderpay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderpay-webapi
  template:
    metadata:
      labels:
        app: orderpay-webapi
    spec:
      containers:
        - name: orderpay-webapi
          image: paulomauri/orderpay-webapi:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: orderpay-secrets
                  key: connection-string
            - name: Keycloak__Authority
              value: "http://localhost/realms/orderpay"
            - name: Keycloak__Audience
              value: "orderpay-webapi"
            - name: Keycloak__MetadataAddress
              value: "http://keycloak:8085/realms/orderpay/.well-known/openid-configuration"
            - name: Keycloak__ValidIssuer
              value: "http://localhost/realms/orderpay"
            - name: Keycloak__RequireHttpsMetadata
              value: "false"
            - name: RabbitMq__Host
              value: "rabbitmq"
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: orderpay-secrets
                  key: rabbitmq-user
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: orderpay-secrets
                  key: rabbitmq-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
