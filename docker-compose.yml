services:
  # ----------------------------------------------------------
  # DevIO.OrderPay.WebAPI
  # ----------------------------------------------------------
  devio.orderpay.webapi:
    image: ${DOCKER_REGISTRY-}devioorderpaywebapi
    build:
      context: .
      dockerfile: src/Apps/DevIO.OrderPay.WebApi/Dockerfile
      # Build on the host network — BuildKit's isolated builder network can fail to
      # reach NuGet (dotnet restore) on this setup; the host network works.
      network: host
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080        # ← forces HTTP only, no HTTPS
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=OrderPayDb;User Id=sa;Password=Mauri@22;TrustServerCertificate=True;
      - Keycloak__Authority=http://id.localhost/realms/orderpay
      - Keycloak__Audience=orderpay-webapi
      - Keycloak__MetadataAddress=http://keycloak:8085/realms/orderpay/.well-known/openid-configuration
      - Keycloak__ValidIssuer=http://id.localhost/realms/orderpay
      - Keycloak__RequireHttpsMetadata=false
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "id.localhost:host-gateway"
    networks:
      - app_network

  # ----------------------------------------------------------
  # orderpay-web — Next.js Frontend
  # ----------------------------------------------------------
  orderpay-web:
    build:
      context: ./orderpay-web
      dockerfile: Dockerfile
      # Build on the host network — BuildKit's isolated builder network can fail to
      # reach registry.npmjs.org (npm ci) on this setup; the host network works.
      network: host
      args:
        NEXT_PUBLIC_API_URL: ""   # empty = same origin; nginx routes /api/ to webapi
    container_name: orderpay-web
    restart: unless-stopped
    environment:
      - NEXTAUTH_URL=http://www.localhost
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-orderpay-web}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_ISSUER=http://id.localhost/realms/orderpay
    depends_on:
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "id.localhost:host-gateway"
    networks:
      - app_network

  # ----------------------------------------------------------
  # Nginx — Reverse Proxy
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orderpay-web
      - devio.orderpay.webapi
      - keycloak
    extra_hosts:
      - "id.localhost:host-gateway"
    networks:
      - app_network

  # ----------------------------------------------------------
  # SQL Server 2025 Developer Edition
  # ----------------------------------------------------------
  sqlserver:
    build:
      context: .
      dockerfile: Dockerfile           # solution root
    container_name: sqlserver2025
    hostname: sqlserver
    restart: unless-stopped
 
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # ⚠  Override SA password via .env file or CI secret manager
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Mauri@22}"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_TCP_PORT: "1433"
 
    ports:
      # HOST_PORT:CONTAINER_PORT
      # Change host port if 1433 is already in use on your machine
      - "${SQL_HOST_PORT:-1433}:1433"
 
    volumes:
      # Named volumes keep data between container restarts
      - sqlserver_data:/var/opt/mssql/data
      - sqlserver_log:/var/opt/mssql/log
      - sqlserver_backup:/var/opt/mssql/backup
 
    networks:
      - app_network
 
    healthcheck:
      test:
        - CMD-SHELL
        - |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA \
          -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # PostgreSQL — Keycloak database
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       keycloak
      POSTGRES_USER:     keycloak
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Mauri@22}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # Keycloak — Authentication server
  # ----------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    command:
        - start-dev
        - --import-realm
        - --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD:-Mauri@22}"

      # Full URL pins the public frontend base for ALL frontend endpoints
      # (issuer, auth, token, jwks_uri) regardless of the request port.
      # Without the scheme, Keycloak stamps the request port (:8085) into the
      # discovery doc → the WebApi's HostRewritingHandler then builds an invalid
      # double-port JWKS URL (keycloak:8085:8085) → IDX10500 → 401 login loop.
      KC_HOSTNAME: http://id.localhost
      KC_HTTP_PORT: 8085

      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-Mauri@22}"
    volumes:
      - ./keycloak:/opt/keycloak/data/import   # ← imports realm on startup
    ports:
      - "8085:8085"     # => HOST:8085 -> CONTAINER:8085
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/9000'"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ----------------------------------------------------------
  # Keycloak Setup — runs once after keycloak is healthy
  # ----------------------------------------------------------
  keycloak-setup:
    image: alpine:latest
    container_name: keycloak-setup
    restart: "no"                        # ← runs once and exits
    environment:
      - KEYCLOAK_WEB_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
    volumes:
      - ./keycloak:/scripts
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl jq &&
        chmod +x /scripts/setup.sh &&
        /scripts/setup.sh
    depends_on:
      keycloak:
        condition: service_healthy       # ← waits for keycloak healthy
    networks:
      - app_network

  # ----------------------------------------------------------
  # Seq (Log)
  # ----------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD:-Mauri@22}"
    ports:
      - "5341:5341"   # ← ingest (Serilog + OTel send here)
      - "8082:80"     # ← UI → http://localhost:8081
    volumes:
      - seq_data:/data
    networks:
      - app_network

# ----------------------------------------------------------
# Named volumes — data survives container restarts
# ----------------------------------------------------------
volumes:
  sqlserver_data:
  sqlserver_log:
  sqlserver_backup:
  postgres_data: 
  seq_data: 
 
# ----------------------------------------------------------
# Shared network
# ----------------------------------------------------------
networks:
  app_network:
    driver: bridge
