# ── id.localhost → Keycloak (auth server) ───────────────────────
server {
    listen 80;
    server_name id.localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream           http://keycloak:8085;
        proxy_pass              $upstream;
        proxy_http_version      1.1;
        proxy_redirect          off;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ── api.localhost → WebApi (Swagger + REST) ──────────────────────
server {
    listen 80;
    server_name api.localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream      http://devio.orderpay.webapi:8080;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── www.localhost → Frontend + same-origin API calls ────────────
server {
    listen 80;
    server_name www.localhost localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # NextAuth routes — must be handled by Next.js, not the webapi
    location /api/auth/ {
        set $upstream      http://orderpay-web:3000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # same-origin /api/v1/ calls from the Next.js frontend → webapi
    location /api/ {
        set $upstream      http://devio.orderpay.webapi:8080;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream      http://orderpay-web:3000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support — Next.js HMR
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
